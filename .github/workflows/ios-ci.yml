name: iOS CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify unsigned native iOS foundations
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Assert pinned Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(sw_vers -productVersion)" == 26.* ]]
          [[ "$(uname -m)" == "arm64" ]]
          [[ "$(xcodebuild -version | sed -n '1p')" == "Xcode 26.6" ]]
          [[ "$(xcodebuild -version | sed -n '2p')" == "Build version 17F113" ]]
          swift --version | grep -F "Apple Swift version 6.3.3"
          [[ "$(xcrun --sdk iphonesimulator --show-sdk-version)" == "26.5" ]]

      - name: Verify portable handoff
        run: python3 docs/ios-handoff/verify-handoff.py

      - name: Test native Swift package
        run: swift test --package-path ios/Packages/PicPacKit

      - name: Build unsigned app (Debug)
        run: >-
          xcodebuild
          -project ios/PicPacPoe.xcodeproj
          -scheme PicPacPoe
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/pic-pac-poe-debug"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build unsigned app (Test)
        run: >-
          xcodebuild
          -project ios/PicPacPoe.xcodeproj
          -scheme PicPacPoe
          -configuration Test
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/pic-pac-poe-test"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-foundation-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pic-pac-poe-debug/Logs/**
            ${{ runner.temp }}/pic-pac-poe-test/Logs/**
          if-no-files-found: ignore
          retention-days: 7
