name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Verify
        run: ./gradlew --no-daemon check :app:assembleDebug :app:bundleRelease
